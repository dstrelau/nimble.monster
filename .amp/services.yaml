services:
  web:
    command: >-
      export AUTH_URL="$(node -p 'process.env.PUBLIC_URL')";
      export ALLOWED_DEV_ORIGINS="$(node -p
      '[new URL(process.env.PUBLIC_URL).hostname, "*.onamp.dev"].join(",")')";
      export NEXT_PUBLIC_BUCKET_NAME="nimble-nexus";
      export NIMBLE_DEV_AUTO_LOGIN_USERNAME="admin";
      exec pnpm dev
    portal:
      title: Nimble Nexus
      description: Development server, automatically logged in as Dev Admin
