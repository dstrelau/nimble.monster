# Curated "related rule" edges. Hand-maintained; every slug must be a real rule
# in data/rules/ or the build fails (see lib/rules/relations.ts). Edges are
# symmetric and stored once — both rules render a link to the other.
#
#   groups: a clique — every member links to every other member. Keep to ~6.
#   hubs:   a star — every member links to the hub only. Use for big families,
#           where a clique would put 17 links under each member.

